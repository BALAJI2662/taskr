services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: worklog-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - PORT=4000
      - NODE_ENV=production
    networks:
      - worklog-net
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://localhost:4000/api/health\").catch(()=>process.exit(0))'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: worklog-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - worklog-net

networks:
  worklog-net:
    driver: bridge
